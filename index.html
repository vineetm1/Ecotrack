<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoTrack - Carbon Footprint Awareness Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🌱 EcoTrack</h1>
    <p>Understand, Track & Reduce Your Carbon Footprint</p>
</header>

<div class="container">

    <div class="card">
        <h2>Carbon Footprint Calculator</h2>

        <label>Monthly Electricity Usage (kWh)</label>
        <input type="number" id="electricity" placeholder="Enter units">

        <label>Vehicle Travel (km/month)</label>
        <input type="number" id="vehicle" placeholder="Enter km">

        <label>LPG Cylinders Used (per month)</label>
        <input type="number" id="lpg" placeholder="Enter cylinders">

        <button onclick="calculateFootprint()">Calculate</button>
    </div>

    <div class="card result">
        <h2>Your Carbon Footprint</h2>
        <h1 id="result">0 kg CO₂</h1>
        <p id="rating"></p>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p id="target"></p>
    </div>

    <div class="card">
        <h2>Personalized Suggestions</h2>
        <ul id="suggestions">
            <li>Calculate your footprint to get suggestions.</li>
        </ul>
    </div>

    <div class="card">
        <h2>Daily Eco Tip</h2>
        <p id="ecoTip">Click the button below.</p>
        <button onclick="generateTip()">Get Eco Tip</button>
    </div>

</div>

<footer>
    Made with ❤️ for a Sustainable Future
</footer>

<script src="script.js"></script>
</body>
</html>
